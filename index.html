<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Dashboard</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; line-height: 1.6; color: #222; }
        .meta { color: #666; font-size: 0.9em; margin-bottom: 20px; }
        .card { background: #f8f9fa; padding: 24px; border-radius: 10px; border: 1px solid #e1e4e8; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1 id="title">Loading...</h1>
    <div class="meta" id="updated"></div>
    <div class="card" id="content">Loading dashboard...</div>

    <script>
        fetch('data.json?nocache=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                document.getElementById('title').textContent = data.title;
                document.getElementById('updated').textContent = 'Last updated: ' + data.last_updated;
                document.getElementById('content').textContent = data.summary;
            });
    </script>
</body>
</html>
